key: multistream_engram_overlap
name:
  zh: Engram 多流重叠
  en: Engram multistream overlap
type: bool
default: 硬件派生（A5 默认 true，其余 false）
status: active
hardware: []
models:
- DeepSeek V4.1 等 Engram 模型
