key: enable_prefill_mc2
name:
  zh: Prefill MC2 预留
  en: Prefill MC2 reservation
type: bool
default: false
status: active
hardware: []
models:
- MoE
requires: []
conflicts: []
desc:
  zh: 为 prefill 批次预留 mc2_token_capacity（用 max_num_batched_tokens 计算）。临时开关，未来 MC2 完备后默认启用并移除。
  en: Reserve mc2_token_capacity for prefill batches using max_num_batched_tokens. Temporary switch; will be removed once
    MC2 is complete.
source: vllm_ascend/config.py
version_support:
  v0.23.0: true
  v0.30.0: true
  main: true
deployment:
  pd: P
  colocated: ok
  note:
    zh: "语义即「为 prefill batch 预留 mc2_token_capacity」；Qwen3.8-Flash-Next 配方 P 节点开启、D 节点不配。官方注明是临时开关，MC2 算子补全后移除。"
    en: "Semantics: reserve mc2_token_capacity for prefill batches; Qwen3.8-Flash-Next enables it on P only. Officially a temporary switch, to be removed once MC2 operators are complete."
  source: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3.8-Flash-Next.html"
