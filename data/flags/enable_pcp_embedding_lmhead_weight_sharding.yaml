key: enable_pcp_embedding_lmhead_weight_sharding
name:
  zh: PCP Embedding/LMHead 分片
  en: PCP embedding/LMHead sharding
type: bool
default: true
status: active
hardware: []
models: []
requires: []
conflicts: []
desc:
  zh: PCP size > 1 时，在每个 TP 分片内对 embedding 与 LM Head 权重跨 PCP rank 分片。与 batch-sharded sampling 及这两个模块的细粒度 TP 不兼容。
  en: When PCP size > 1, shard embedding and LM Head weights across PCP ranks within each TP shard. Incompatible with batch-sharded
    sampling and fine-grained TP for these modules.
source: vllm_ascend/config.py
version_support:
  v0.23.0: false
  v0.30.0: true
  main: true
version_note:
  zh: v0.30.0 新增
  en: New in v0.30.0
deployment:
  pd: unknown
  colocated: unknown
  note:
    zh: "未见官方文档对本开关在混部（colocated）或 PD 分离部署下的专门说明；实践上可按全节点统一配置处理，欢迎补充实测结论。"
    en: "No official guidance found for colocated or PD-disaggregated deployment; configure uniformly across nodes in practice. Field reports welcome."
