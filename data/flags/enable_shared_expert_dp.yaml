key: enable_shared_expert_dp
name:
  zh: 共享专家数据并行
  en: Shared-expert data parallel
type: bool
default: false
status: active
hardware: []
models:
- MoE
requires: []
conflicts: []
desc:
  zh: 在 TP rank 间复制共享专家权重并以数据并行运行。提升性能但消耗更多内存，与上游 MoE 序列并行相互独立。
  en: Replicate shared-expert weights across TP ranks and run them data-parallel. Improves performance at higher memory cost;
    independent of upstream MoE sequence parallelism.
source: vllm_ascend/config.py
version_support:
  v0.23.0: true
  v0.30.0: true
  main: true
deployment:
  pd: both
  colocated: ok
  note:
    zh: "官方 PD 配方 P/D 两侧均出现；DeepSeek-V4-Pro 说明其作用为把 shared experts 放到 DP ranks。"
    en: "Appears on both sides in official PD recipes; DeepSeek-V4-Pro: places shared experts on DP ranks."
  source: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Pro.html"
