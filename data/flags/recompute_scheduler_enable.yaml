key: recompute_scheduler_enable
name:
  zh: 重计算调度
  en: Recompute scheduler
type: bool
default: false
status: deprecated
hardware: []
models: []
requires: []
conflicts: []
desc:
  zh: 启用重计算调度器。仅在 PD 分离的 D 节点（kv_consumer）有效；在 P 节点或 PD-mixed 模式下启用会在启动时报明确错误。v0.30.0 起顶层键废弃，请改用 scheduler_config.recompute_scheduler_enable。
  en: Enable the recompute scheduler. Effective only on the decode node (kv_consumer) of a P/D disaggregation; enabling on a prefill node or PD-mixed mode raises an explicit startup error. Top-level key deprecated since v0.30.0; use scheduler_config.recompute_scheduler_enable instead.
    mode fails startup with a clear error.
source: vllm_ascend/config.py
version_note:
  zh: v0.30.0 起顶层键废弃（仍可用，发 deprecation 警告），规范写法 scheduler_config.recompute_scheduler_enable
  en: top-level key deprecated since v0.30.0 (still works with a warning); canonical form scheduler_config.recompute_scheduler_enable
version_support:
  v0.23.0: true
  v0.30.0: true
  main: true
deployment:
  pd: D
  colocated: n/a
  note:
    zh: "官方配置文档：仅在 PD 分离 D 节点（kv_consumer）有效——「Do not enable on P nodes or in PD-mixed mode … startup will fail」；GLM5 表注明 P 节点置 false；与 dyntra_lb_config 同开时组成 combined scheduler。"
    en: "Official config doc: valid only on PD-disaggregated D nodes — \"Do not enable on P nodes or in PD-mixed mode ... startup will fail\"; GLM5 table sets it false on P; combined with dyntra_lb_config it forms the combined scheduler."
  source: "https://docs.vllm.ai/projects/ascend/en/latest/user_guide/configuration/additional_config.html"
