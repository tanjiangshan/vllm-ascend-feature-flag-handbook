key: weight_nz_mode
name:
  zh: 权重 NZ 格式
  en: Weight NZ mode
type: int
default: 1
status: active
legacy_env: VLLM_ASCEND_ENABLE_NZ
hardware: []
models: []
requires: []
conflicts: []
values:
  '0': 禁用 NZ
  '1': 仅对量化权重启用 NZ
  '2': 在支持的情况下也对 BF16/FP16 权重启用 NZ
desc:
  zh: 权重 NZ 格式模式。0 禁用，1 仅量化权重，2 扩展至 BF16/FP16。
  en: Weight NZ layout mode. 0 disables NZ, 1 enables for quantized weights only, 2 extends to BF16/FP16 when supported.
source: vllm_ascend/config.py
version_support:
  v0.23.0: true
  v0.30.0: true
  main: true
deployment:
  pd: both
  colocated: ok
  note:
    zh: "官方 PD 配方 P/D 两侧均配置（Qwen3.5-397B-A17B、MiniMax-M3 等）；取值由权重格式决定（0 关 / 1 仅量化权重 / 2 含 BF16/FP16）。"
    en: "Configured on both sides in official PD recipes (Qwen3.5-397B-A17B, MiniMax-M3, etc.); value follows weight format (0 off / 1 quantized only / 2 incl. BF16/FP16)."
  source: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3.5-397B-A17B.html"
