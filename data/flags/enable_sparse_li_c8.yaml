key: enable_sparse_li_c8
name:
  zh: LI-C8 稀疏缓存
  en: LI-C8 sparse cache
type: bool
default: false
status: removed
hardware: []
models:
- GLM-5 系列、DeepSeek 稀疏注意力模型
requires: []
conflicts:
- enable_sparse_li_c4（由 indexer_kv_dtype=mxfp4 派生，互斥）
removed_in:
- v0.30.0（被 derive_and_validate 无条件覆盖，additional-config 传入无效）
desc:
  zh: 为稀疏注意力（Lightning Indexer）启用 C8 KV cache 布局。v0.23.0 可经 additional-config 设置；v0.30.0 起改为派生量：由 --attention_config.indexer_kv_dtype ∈ {fp8, int8} 自动决定（且要求模型为稀疏注意力模型），传本键不再生效。
  en: C8 KV cache layout for sparse attention (Lightning Indexer). Settable via additional-config on v0.23.0; derived since v0.30.0 — automatically decided by --attention_config.indexer_kv_dtype ∈ {fp8, int8} (requires a sparse-attention model); passing this key has no effect.
source: vllm_ascend/ascend_config.py @ v0.23.0（v0.30.0 起派生）
version_support:
  v0.23.0: true
  v0.30.0: false
  main: false
version_note:
  zh: v0.30.0 起由 --attention_config.indexer_kv_dtype fp8/int8 派生
  en: derived from --attention_config.indexer_kv_dtype fp8/int8 since v0.30.0
deployment:
  pd: D
  colocated: unknown
  note:
    zh: "GLM5.2 PD 配方中配在 D 节点（kv_consumer）；GLM5 优化表按吞吐场景区分：高吞吐/PD 场景开启、低延迟场景关闭。v0.30.0 起由 --attention_config.indexer_kv_dtype 派生。"
    en: "Set on the D node (kv_consumer) in the GLM5.2 PD recipe; GLM5 table: on for high-throughput/PD, off for low-latency. Derived from --attention_config.indexer_kv_dtype since v0.30.0."
  source: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/GLM5.2.html"
