  en: Mixed expert placement
type: bool
default: false
status: active
hardware: []
models: []
requires: []
conflicts: []
desc:
  zh: 混合放置模式（DP×TP 平面上的专家/权重放置策略），计入 RFork 权重传输的兼容性指纹；发送端与接收端配置不一致会导致指纹不匹配。
  en: Mixed placement mode (expert/weight placement on the DP×TP plane); counted into the RFork weight-transfer compatibility fingerprint — a sender/receiver mismatch breaks the fingerprint.
source: vllm_ascend/ascend_config.py + docs.vllm.ai user_guide/feature_guide/rfork
version_support:
  v0.23.0: true
  v0.30.0: true
  main: true
deployment:
  pd: unknown
  colocated: unknown
  note:
    zh: "未见官方文档对本开关在混部（colocated）或 PD 分离部署下的专门说明；实践上可按全节点统一配置处理，欢迎补充实测结论。"
    en: "No official guidance found for colocated or PD-disaggregated deployment; configure uniformly across nodes in practice. Field reports welcome."
