name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate tables & validate databases
        run: python scripts/generate_tables.py

      - name: Traceability audit (engine args)
        run: python scripts/audit_engine_args.py

      - name: Ensure generated files are up to date
        run: git diff --exit-code -- docs/includes docs/flags.json docs/engine-args.json docs/engine-args/index.md docs/engine-args/index.en.md

      - name: Build site (strict)
        run: mkdocs build --strict
